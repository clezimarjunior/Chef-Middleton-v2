<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Danos tu opinión – Chef Middleton</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#fcfbf1;--bg2:#F4F0E8;
  --green:#9c9a36;--green2:#b3b140;--green-light:rgba(156,154,54,0.08);--green-border:rgba(156,154,54,0.20);
  --ink:#1E1A13;--ink2:#5C5448;--ink3:#9A8F85;
  --border:rgba(30,26,19,0.09);--border2:rgba(30,26,19,0.16);
  --gold:#d0ad67;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:'Lato',sans-serif;font-weight:300;line-height:1.75;min-height:100vh;display:flex;flex-direction:column}

/* NAV — minimal, single link home, no menu to dig through */
.rv-nav{padding:22px 24px;display:flex;justify-content:center;border-bottom:1px solid var(--border)}
.rv-logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.rv-logo img{width:42px;height:auto}
.rv-logo-text{display:flex;flex-direction:column;line-height:1.15}
.rv-logo-chef{font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--green);font-weight:700}
.rv-logo-name{font-family:'Playfair Display',serif;font-size:17px;color:var(--ink);font-weight:500}

/* LANG */
.lang-btns{position:fixed;top:16px;right:16px;display:flex;gap:0;z-index:50;background:var(--ink);border-radius:2px;overflow:hidden}
.lang-btn{background:none;border:none;color:rgba(255,255,255,0.4);font-size:9px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;padding:7px 12px;font-family:'Lato',sans-serif;transition:color 0.2s}
.lang-btn.on{color:#fff;font-weight:700}

main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 20px}
.rv-card{width:100%;max-width:540px}

.rv-eyebrow{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:14px}
.rv-eyebrow-line{width:24px;height:1px;background:var(--green)}
.rv-eyebrow span{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--green);font-weight:700}
.rv-title{font-family:'Playfair Display',serif;font-size:clamp(28px,5vw,40px);font-weight:500;text-align:center;line-height:1.2;margin-bottom:12px}
.rv-sub{font-size:14px;color:var(--ink2);text-align:center;max-width:420px;margin:0 auto 40px;line-height:1.85}

/* STAR RATING */
.rv-stars-wrap{text-align:center;margin-bottom:32px}
.rv-stars{display:inline-flex;flex-direction:row-reverse;gap:6px}
.rv-stars input{display:none}
.rv-stars label{font-size:38px;color:var(--border2);cursor:pointer;transition:color 0.2s;line-height:1}
.rv-stars input:checked ~ label,
.rv-stars label:hover,
.rv-stars label:hover ~ label{color:var(--gold)}
.rv-stars-help{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--ink3);margin-top:6px}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ff{grid-column:1/-1}
.flabel{display:block;font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:var(--ink3);margin-bottom:7px;font-weight:700}
.finput{width:100%;background:#fff;border:1px solid var(--border2);color:var(--ink);padding:12px 16px;font-family:'Lato',sans-serif;font-size:14px;outline:none;transition:border-color 0.3s;-webkit-appearance:none;font-weight:300}
.finput:focus{border-color:var(--green)}
.finput::placeholder{color:var(--ink3)}
textarea.finput{height:120px;resize:vertical}
select.finput{cursor:pointer}

.btn-primary{padding:14px 36px;background:var(--green);color:#fff;text-decoration:none;font-size:10px;letter-spacing:3px;text-transform:uppercase;font-weight:700;border-radius:2px;transition:all 0.3s;border:2px solid var(--green);display:inline-block;cursor:pointer;font-family:'Lato',sans-serif;width:100%}
.btn-primary:hover{background:transparent;color:var(--green)}
.btn-primary:disabled{opacity:0.6;cursor:default}

#form-msg{display:none;margin-top:20px;padding:14px 18px;font-size:13px;text-align:center;border-radius:2px}

.rv-footer{padding:24px;text-align:center}
.rv-footer a{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--ink3);text-decoration:none;border-bottom:1px solid transparent;transition:color 0.2s}
.rv-footer a:hover{color:var(--green)}

@media(max-width:480px){
  .form-grid{grid-template-columns:1fr}
  .ff{grid-column:1}
  .rv-stars label{font-size:32px}
}
</style>
</head>
<body>

<div class="lang-btns">
  <button class="lang-btn on" onclick="setLang('es',this)">ES</button>
  <button class="lang-btn" onclick="setLang('en',this)">EN</button>
</div>

<nav class="rv-nav">
  <a href="index.html" class="rv-logo">
    <img src="assets/brand-v2.png" alt="Chef Middleton">
    <div class="rv-logo-text">
      <span class="rv-logo-chef">Chef</span>
      <span class="rv-logo-name">Middleton</span>
    </div>
  </a>
</nav>

<main>
  <div class="rv-card">

    <div id="rv-form-wrap">
      <div class="rv-eyebrow"><div class="rv-eyebrow-line"></div><span class="t" data-es="Tu opinión" data-en="Your feedback">Tu opinión</span><div class="rv-eyebrow-line"></div></div>
      <h1 class="rv-title t" data-es-h="¿Cómo fue tu<br>experiencia?" data-en-h="How was your<br>experience?">¿Cómo fue tu<br>experiencia?</h1>
      <p class="rv-sub t" data-es="Gracias por dejarnos unos minutos. Tu opinión nos ayuda a seguir mejorando cada experiencia." data-en="Thank you for taking a moment. Your feedback helps us keep improving every experience.">Gracias por dejarnos unos minutos. Tu opinión nos ayuda a seguir mejorando cada experiencia.</p>

      <form id="review-form" action="https://formspree.io/f/xreokwrk" method="POST" onsubmit="handleReviewSubmit(event)">
        <input type="hidden" name="_subject" value="⭐ Nueva reseña — Chef Middleton">
        <input type="hidden" name="tipo_envio" value="Reseña de cliente">
        <input type="hidden" name="valoracion" id="valoracion-hidden" value="">

        <div class="rv-stars-wrap">
          <div class="rv-stars">
            <input type="radio" name="rating-star" id="star5" value="5"><label for="star5" onclick="setRating(5)">★</label>
            <input type="radio" name="rating-star" id="star4" value="4"><label for="star4" onclick="setRating(4)">★</label>
            <input type="radio" name="rating-star" id="star3" value="3"><label for="star3" onclick="setRating(3)">★</label>
            <input type="radio" name="rating-star" id="star2" value="2"><label for="star2" onclick="setRating(2)">★</label>
            <input type="radio" name="rating-star" id="star1" value="1"><label for="star1" onclick="setRating(1)">★</label>
          </div>
          <div class="rv-stars-help t" data-es="Toca para valorar" data-en="Tap to rate">Toca para valorar</div>
        </div>

        <div class="form-grid">
          <div><label class="flabel t" data-es="Nombre" data-en="Name">Nombre</label><input type="text" name="nombre" class="finput t" data-es-ph="Tu nombre" data-en-ph="Your name" placeholder="Tu nombre" required></div>
          <div><label class="flabel t" data-es="Tipo de experiencia" data-en="Experience type">Tipo de experiencia</label>
            <select name="tipo_experiencia" class="finput" required>
              <option value="" disabled selected class="t" data-es="Selecciona" data-en="Select">Selecciona</option>
              <option class="t" data-es="Chef privado en casa" data-en="Private chef at home">Chef privado en casa</option>
              <option class="t" data-es="Evento privado" data-en="Private event">Evento privado</option>
              <option class="t" data-es="Menú degustación" data-en="Tasting menu">Menú degustación</option>
              <option class="t" data-es="Otro" data-en="Other">Otro</option>
            </select>
          </div>
          <div class="ff"><label class="flabel t" data-es="Tu reseña" data-en="Your review">Tu reseña</label><textarea name="comentario" class="finput t" data-es-ph="Cuéntanos qué tal fue tu experiencia con nosotros..." data-en-ph="Tell us about your experience..." placeholder="Cuéntanos qué tal fue tu experiencia con nosotros..." required></textarea></div>
          <div class="ff"><button type="submit" class="btn-primary t" id="rv-btn" data-es="Enviar reseña" data-en="Send review">Enviar reseña</button></div>
        </div>
        <div id="form-msg"></div>
      </form>
    </div>

  </div>
</main>

<footer class="rv-footer">
  <a href="index.html" class="t" data-es="← Volver al sitio" data-en="← Back to site">← Volver al sitio</a>
</footer>

<script>
function setRating(n){
  document.getElementById('valoracion-hidden').value = n + '/5';
}
function setLang(l,btn){
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  document.documentElement.lang = l;
  try{localStorage.setItem('cm_lang',l);}catch(e){}
  document.querySelectorAll('.t').forEach(el=>{
    if(el.tagName==='INPUT'||el.tagName==='TEXTAREA'){
      const ph=el.dataset[l+'Ph'];if(ph!==undefined)el.placeholder=ph;
    } else {
      const hval=el.dataset[l+'H'];
      const val=el.dataset[l];
      if(hval!==undefined)el.innerHTML=hval;
      else if(val!==undefined)el.textContent=val;
    }
  });
}
function initLang(){
  var saved=null;
  try{saved=localStorage.getItem('cm_lang');}catch(e){}
  var lang=saved;
  if(!lang){
    var nav=(navigator.language||navigator.userLanguage||'es').toLowerCase();
    lang=nav.indexOf('es')===0?'es':'en';
  }
  if(lang==='en'){
    var btns=document.querySelectorAll('.lang-btn');
    if(btns[1])setLang('en',btns[1]);
  }
}
document.addEventListener('DOMContentLoaded',initLang);
async function handleReviewSubmit(e){
  e.preventDefault();
  const form=document.getElementById('review-form');
  const btn=document.getElementById('rv-btn');
  const msg=document.getElementById('form-msg');
  const isEN=document.querySelector('.lang-btn.on')&&document.querySelector('.lang-btn.on').textContent.trim()==='EN';

  if(!document.getElementById('valoracion-hidden').value){
    msg.textContent=isEN?'Please choose a star rating.':'Por favor, selecciona una valoración.';
    msg.style.background='rgba(180,60,60,0.08)';msg.style.color='#b43c3c';msg.style.border='1px solid rgba(180,60,60,0.2)';
    msg.style.display='block';
    return;
  }

  btn.disabled=true;btn.style.opacity='0.6';
  try{
    const res=await fetch(form.action,{method:'POST',body:new FormData(form),headers:{Accept:'application/json'}});
    if(res.ok){
      document.getElementById('rv-form-wrap').innerHTML =
        '<div style="text-align:center;padding:40px 0">'+
        '<div style="font-family:\'Playfair Display\',serif;font-size:40px;color:var(--gold);margin-bottom:18px">&#10003;</div>'+
        '<h1 class="rv-title" style="margin-bottom:14px">'+(isEN?'Thank you!':'¡Gracias!')+'</h1>'+
        '<p class="rv-sub" style="margin-bottom:0">'+(isEN?'Your review means a lot to us.':'Tu opinión significa mucho para nosotros.')+'</p>'+
        '</div>';
    } else {
      throw new Error();
    }
  } catch {
    msg.textContent=isEN?'Something went wrong. Please try again.':'Algo salió mal. Por favor intenta de nuevo.';
    msg.style.background='rgba(180,60,60,0.08)';msg.style.color='#b43c3c';msg.style.border='1px solid rgba(180,60,60,0.2)';
    msg.style.display='block';
    btn.disabled=false;btn.style.opacity='1';
  }
}
</script>
</body>
</html>
